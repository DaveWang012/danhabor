<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="王海街创作者档案" />
    <title>谁是王海街？ | 丹港档案馆</title>
    <script src="./danhabor-shell-redirect.js"></script>
    <link rel="stylesheet" href="./danhabor-author.css?v=20260726-1" />
    <link rel="stylesheet" href="./danhabor-music-player.css?v=20260726-1" />
  </head>
  <body data-page-key="author">
    <header class="author-topbar">
      <a href="./danhabor-001-preview.html?view=archive"><strong>丹港档案馆</strong><span>DANGANG ARCHIVE / AUTHOR FILE</span></a>
      <button id="edit-author" type="button">编辑作者档案</button>
      <a href="./danhabor-001-preview.html?view=archive">← 返回档案室</a>
    </header>

    <main class="author-sheet">
      <section class="author-identity">
        <div class="identity-copy">
          <p class="eyebrow">GLOBAL ARCHIVE / AUTHOR FILE</p>
          <h1>档案馆记录者 <em id="author-name-bracket">[ 王海街 ]</em></h1>
          <p class="roles" id="author-roles"></p>
          <p class="lead" id="author-lead"></p>
          <span class="verified">DANGANG ARCHIVE<br />VERIFIED</span>
        </div>
        <figure class="portrait-frame">
          <img id="author-portrait" alt="王海街肖像" />
          <figcaption id="author-signature">王海街</figcaption>
        </figure>
        <dl class="identity-facts" id="author-facts"></dl>
      </section>

      <section class="author-paper">
        <div class="paper-column">
          <section>
            <h2>关于我 <small>ABOUT ME</small></h2>
            <p id="author-about"></p>
            <div class="tag-list" id="author-tags"></div>
            <p class="tools" id="author-tools"></p>
          </section>
        </div>
        <div class="paper-column">
          <section>
            <h2>创作方向 <small>FOCUS</small></h2>
            <div class="focus-list" id="author-focus"></div>
          </section>
        </div>
        <section class="paper-wide">
          <h2>代表项目 <small>KEY PROJECTS</small></h2>
          <div class="project-grid" id="author-projects"></div>
        </section>
        <section class="paper-half">
          <h2>创作方法 <small>APPROACH</small></h2>
          <div class="method-list" id="author-methods"></div>
        </section>
        <section class="paper-half statement">
          <h2>个人宣言 <small>STATEMENT</small></h2>
          <blockquote id="author-statement"></blockquote>
        </section>
      </section>
    </main>

    <dialog id="author-editor">
      <form id="author-form">
        <header><h2>编辑作者档案</h2><button id="close-author-editor" type="button" aria-label="关闭">×</button></header>
        <div class="editor-grid">
          <label>姓名<input name="name" required /></label>
          <label>角色定位<input name="roles" /></label>
          <label class="wide">引言<textarea name="lead"></textarea></label>
          <label class="wide">关于我<textarea name="about"></textarea></label>
          <label>档案编号<input name="archiveNumber" /></label>
          <label>建立时间<input name="established" /></label>
          <label>身份标识<input name="identity" /></label>
          <label>所在机构<input name="organization" /></label>
          <label class="wide">专注标签（JSON 数组）<textarea name="tags" data-json></textarea></label>
          <label class="wide">技能工具<textarea name="tools"></textarea></label>
          <label class="wide">创作方向（JSON）<textarea name="focus" data-json></textarea></label>
          <label class="wide">代表项目（JSON）<textarea name="projects" data-json></textarea></label>
          <label class="wide">创作方法（JSON）<textarea name="methods" data-json></textarea></label>
          <label class="wide">个人宣言<textarea name="statement"></textarea></label>
          <label class="wide">头像路径或 URL<input name="portrait" /></label>
          <label class="wide">或上传头像<input id="author-portrait-file" type="file" accept="image/*" /></label>
        </div>
        <footer><button id="reset-author" type="button">恢复默认</button><span></span><button id="cancel-author" type="button">取消</button><button class="primary" type="submit">保存</button></footer>
      </form>
    </dialog>
    <div class="author-toast" id="author-toast" hidden></div>

    <script src="./danhabor-author.js?v=20260726-1"></script>
    <script src="./danhabor-music-player.js?v=20260726-1"></script>
  </body>
</html>
