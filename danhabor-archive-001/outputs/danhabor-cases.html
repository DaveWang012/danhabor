  </head>
  <body data-page-key="cases">
    <header class="site-header"><div class="brand"><strong>DNYTV1 ARCHIVE</strong><span>CASE CONTROL SYSTEM</span></div><a class="back-link" href="./danhabor-001-preview.html?view=archive">← 返回档案室</a></header>
    <main>
      <section class="hero"><div class="hero-image-actions"><button id="change-hero-image" type="button">更换背景</button><button id="reset-hero-image" type="button" hidden>恢复默认</button><input id="hero-image-input" type="file" accept="image/*" hidden /></div><div class="hero-copy"><p class="kicker">CASE FILE / 案件档案</p><h1>案件档案</h1><p>被删除的编号、互相冲突的证词与无法归档的影像，都在这里留下案件索引。</p></div></section>
      <section class="archive-main">
        <div class="archive-tools"><form class="search" id="search-form"><input id="record-search" type="search" placeholder="搜索案件名称、编号或线索" aria-label="搜索案件档案" /><button type="submit" aria-label="搜索">⌕</button></form><button class="add-record" id="add-record" type="button">新增案件</button></div>
        <div class="records" id="records"></div>
      </section>
    </main>
    <footer class="page-footer"><div class="footer-inner"><span>DNYTV1 / RESTRICTED CASE INDEX / <span id="page-date"></span></span></div></footer>

    <dialog id="record-dialog">
      <form class="editor" id="record-form">
        <h2 id="editor-title">编辑档案记录</h2>
        <label class="field">档案编号<input id="record-code" required /></label>
        <label class="field">案件名称<input id="record-title" required /></label>
        <label class="field">案件副题<input id="record-subtitle" required /></label>
        <label class="field">案件说明<textarea id="record-body" required></textarea></label>
        <label class="field">图片地址（可选）<input id="record-image-url" placeholder="https://... 或相对路径" /></label>
        <label class="field">或上传本地图片<input id="record-image-file" type="file" accept="image/*" /></label>
        <label class="field">关联页面地址（可选）<input id="record-link" placeholder="./danhabor-origin.html" /></label>
        <div class="editor-actions"><button class="danger" id="delete-record" type="button">删除</button><div class="action-group"><button id="cancel-editor" type="button">取消</button><button class="primary" type="submit">保存</button></div></div>
      </form>
    </dialog>
    <div class="status" id="status" hidden></div>
